# pnpm 12 settings live here — its non-auth .npmrc keys are ignored.

# sass pulls @parcel/watcher; its install script only matters on platforms
# without a prebuilt binary, and Linux x64 has one
# (@parcel/watcher-linux-x64-glibc) — skip the node-gyp fallback.
allowBuilds:
  "@parcel/watcher": false

# pnpm 12 refuses packages younger than minimumReleaseAge (24h). sugar-high
# 2.4.0 (the JSON grammar + escaping this app relies on) was published
# 2026-09-09T15:04Z; the entry can go once that age is past.
minimumReleaseAgeExclude:
  - sugar-high@2.4.0
  - '@rebase-ui/core@0.1.1'
  - '@rebase-ui/reze@0.1.2'

# @rebase-ui/reze@0.1.2 fails `vite build` with the published compiler: for
# `const ref = mergeRefs(…); <el ref={ref}>` it emits `ref = el` and the bundler
# rejects the reassignment of a const (ILLEGAL_REASSIGNMENT). The patch turns
# those `const` into `let`; drop it when the library ships the fix.
patchedDependencies:
  '@rebase-ui/reze@0.1.2': patches/@rebase-ui__reze@0.1.2.patch
